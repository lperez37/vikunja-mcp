services:
  mcp:
    build: .
    mem_limit: 512m
    ports:
      - "127.0.0.1:8847:8847"
      - "100.119.183.110:8847:8847"
    environment:
      - MCP_TRANSPORT=http
      - PORT=8847
      - VIKUNJA_URL=${VIKUNJA_URL}
      - VIKUNJA_API_TOKEN=${VIKUNJA_API_TOKEN}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:?MCP_AUTH_TOKEN is required}
    restart: unless-stopped
